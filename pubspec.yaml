name: flutter_boxd_app_flow
description: Flutter app with login/register flow (light theme).
publish_to: 'none'

version: 1.0.4+260719221

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  provider: ^6.0.5
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.9
  flutter_native_splash: ^2.4.1
  flutter_blue_plus: ^1.31.6
  permission_handler: ^11.3.0
  location: ^6.0.2
  device_info_plus: ^11.1.0
  package_info_plus: ^8.0.2
  shared_preferences: ^2.3.2
  device_calendar: ^4.3.2
  timezone: ^0.9.2
  url_launcher: ^6.2.5
  webview_flutter: ^4.4.2
  flutter_local_notifications: ^17.2.2
  # 本地 fork：pubspec 仅声明 android，不包含友盟 iOS 原生依赖
  umeng_push_sdk:
    path: packages/umeng_push_sdk
  umeng_common_sdk:
    path: packages/umeng_common_sdk
  firebase_messaging:
    path: packages/firebase_messaging
  # Android-only 的 firebase_core 未带 web；分析/Web 条件导入需要能解析此包
  firebase_core:
    path: packages/firebase_core
  firebase_core_web: ^3.6.0
  flutter_slidable: ^3.1.1

dependency_overrides:
  # 覆盖 hosted 的 firebase_core，使用本仓库 Android-only 副本（iOS 无 Firebase Pod）
  firebase_core:
    path: packages/firebase_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  flutter_gen_runner: ^5.4.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter_gen:
  output: lib/gen/
  line_length: 120
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
    - assets/launch/images/
    - assets/login/images/
    - assets/home/images/
    - assets/user/images/
    - assets/device/images/
    - assets/common/images/
    - assets/setting/images/

flutter_native_splash:
  color: "#FFFFFF"
  # 使用文字启动页面，不再使用图片
  android_gravity: center
  fullscreen: false
  android_12:
    color: "#FFFFFF"
  ios: true
  android: true
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon/app_icon.png"
