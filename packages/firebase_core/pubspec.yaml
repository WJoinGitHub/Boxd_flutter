name: firebase_core
description: >
  Vendored from flutterfire 4.7.0 — Android plugin only (no iOS/macOS/web/windows
  in flutter.plugin.platforms), so iOS CocoaPods does not pull Firebase SDK.
homepage: https://firebase.google.com/docs/flutter/setup
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_core/firebase_core
version: 4.7.0+boxd.1
topics:
  - firebase
  - core

false_secrets:
  - example/**

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  firebase_core_platform_interface: ^6.0.3
  flutter:
    sdk: flutter
  meta: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.0.0
  plugin_platform_interface: ^2.1.3

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.firebase.core
        pluginClass: FlutterFirebaseCorePlugin
